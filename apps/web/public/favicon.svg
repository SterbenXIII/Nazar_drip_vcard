<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="bag-clip">
      <rect x="27" y="18" width="46" height="44" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#2c3e50"/>

  <!-- Hanger/hook -->
  <path d="M44 18 Q44 10 50 10 Q56 10 56 18"
        stroke="#6aafa0" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- IV bag body -->
  <rect x="27" y="18" width="46" height="44" rx="9" fill="white"/>

  <!-- Liquid level (~45% fill from bottom) -->
  <rect x="27" y="41" width="46" height="21" fill="#347d64" clip-path="url(#bag-clip)"/>

  <!-- Liquid surface shimmer -->
  <line x1="29" y1="41" x2="71" y2="41" stroke="white" stroke-width="1" opacity="0.3"/>

  <!-- Tube connector -->
  <rect x="46" y="62" width="8" height="5" rx="2" fill="white" opacity="0.7"/>

  <!-- Tube -->
  <rect x="48" y="67" width="4" height="11" rx="2" fill="white" opacity="0.75"/>

  <!-- Drop (крапля — root word of крапельниця) -->
  <path d="M50 77 C46.5 82 43 87 43 90.5 C43 94.5 46.1 97 50 97 C53.9 97 57 94.5 57 90.5 C57 87 53.5 82 50 77Z"
        fill="#347d64"/>

  <!-- Drop highlight -->
  <ellipse cx="47.5" cy="88" rx="2" ry="3.5" fill="white" opacity="0.25" transform="rotate(-20,47.5,88)"/>
</svg>
