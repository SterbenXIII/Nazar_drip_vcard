<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Teal accent bar (left) -->
  <rect x="0" y="0" width="8" height="630" fill="#347d64" />

  <!-- IV Drip icon (right side, decorative) -->
  <g transform="translate(880, 120)" opacity="0.15">
    <rect x="40" y="0" width="6" height="280" rx="3" fill="#347d64"/>
    <rect x="0" y="60" width="90" height="60" rx="10" fill="none" stroke="#347d64" stroke-width="5"/>
    <circle cx="43" cy="90" r="18" fill="#347d64"/>
    <rect x="40" y="120" width="6" height="120" rx="3" fill="#347d64"/>
    <circle cx="43" cy="250" r="30" fill="none" stroke="#347d64" stroke-width="5"/>
  </g>

  <!-- Badge pill top -->
  <rect x="80" y="70" width="240" height="38" rx="19" fill="#347d64"/>
  <text x="200" y="94" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">🟢 24/7 ЦІЛОДОБОВО</text>

  <!-- Main headline -->
  <text x="80" y="200" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="white" letter-spacing="-1">Крапельниці від</text>
  <text x="80" y="278" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="white" letter-spacing="-1">алкоголю на дому</text>

  <!-- Teal accent underline -->
  <rect x="80" y="296" width="420" height="5" rx="3" fill="#347d64"/>

  <!-- Subtitle -->
  <text x="80" y="358" font-family="Arial, sans-serif" font-size="32" fill="#9ec8b4" font-weight="400">Медична допомога у Львові</text>

  <!-- Divider -->
  <rect x="80" y="430" width="1040" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- Bottom: phone -->
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="28" fill="#347d64" font-weight="700">📞 +380 63 481 4077</text>

  <!-- Bottom: trust badges -->
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="20" fill="#9ec8b4">🛡️ 100% Стерильно</text>
  <text x="380" y="550" font-family="Arial, sans-serif" font-size="20" fill="#9ec8b4">🚑 Швидкий виїзд</text>
  <text x="660" y="550" font-family="Arial, sans-serif" font-size="20" fill="#9ec8b4">📑 За протоколом</text>

  <!-- Site URL bottom right -->
  <text x="1120" y="590" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.5" text-anchor="end">krapelnytsia.lviv.ua</text>
</svg>
