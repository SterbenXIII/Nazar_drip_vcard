server {
    listen 8080;
    listen [::]:8080;
    server_name ${DOMAIN_NAME} www.${DOMAIN_NAME} localhost _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- SSG routing: serve static files, return 404 for missing ---
    location / {
        try_files $uri $uri/index.html /404.html =404;
        # HTML documents must never be cached — always fetch fresh from server
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # --- Service worker: must not be cached (browsers enforce this, but be explicit) ---
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        access_log off;
    }

    # --- Immutable hashed assets (_astro/) — cache 1 year ---
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Static assets (images, fonts, icons) — cache 30 days ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- Sitemap & robots.txt — no cache ---
    location ~* ^/(sitemap.*\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # --- Custom 404 page ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
