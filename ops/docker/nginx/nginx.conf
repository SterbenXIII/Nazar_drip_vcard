# --- ОСНОВНИЙ САЙТ (Astro + Backend) ---
server {
    listen 8080;
    server_name your-domain.com; # Твій основний домен

    # Фронтенд Astro
    location / {
        proxy_pass http://astro-vcard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Бекенд на Node.js (Webhook для форми)
    location /webhook/ {
        proxy_pass http://medical-backend:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- АВТОМАТИЗАЦІЯ (n8n) ---
server {
    listen 8080;
    server_name n8n.your-domain.com; # Піддомен для n8n

    location / {
        proxy_pass http://n8n-app:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Важливо для роботи інтерфейсу n8n (WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
