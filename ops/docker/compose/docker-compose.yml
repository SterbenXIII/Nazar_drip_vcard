services:
  # Frontend (Astro + Nginx)
  web:
    image: ${IMAGE_REGISTRY:-}vcard-web:${IMAGE_TAG:-latest}
    build:
      context: ../../../
      dockerfile: ops/docker/web/Dockerfile
      target: runtime
      args:
        - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    container_name: vcard-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101 # Allow envsubst to write config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    networks:
      - web-gateway
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Backend API (Hono + SQLite)
  api:
    image: ${IMAGE_REGISTRY:-}vcard-api:${IMAGE_TAG:-latest}
    build:
      context: ../../../
      dockerfile: ops/docker/api/Dockerfile
      target: runtime
      args:
        - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    container_name: vcard-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ../../../.env
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=5678
    volumes:
      - api_data:/app/data
      - ../../../apps/api/allowed_chats.json:/app/allowed_chats.json:ro
    networks:
      - web-gateway
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5678/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  web-gateway:
    name: web-gateway
    external: true

volumes:
  api_data:
    driver: local
