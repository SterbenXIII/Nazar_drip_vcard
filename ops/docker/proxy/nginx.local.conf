# Редирект з HTTP на HTTPS
server {
    listen 80;
    server_name vcard.local n8n.local;
    return 301 https://$host$request_uri;
}

# --- Frontend (Astro) на HTTPS ---
server {
    listen 443 ssl;
    server_name vcard.local;

    ssl_certificate /etc/nginx/certs/vcard.local.pem;
    ssl_certificate_key /etc/nginx/certs/vcard.local-key.pem;

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- n8n на HTTPS ---
server {
    listen 443 ssl;
    server_name n8n.local;

    ssl_certificate /etc/nginx/certs/vcard.local.pem;
    ssl_certificate_key /etc/nginx/certs/vcard.local-key.pem;

    location / {
        proxy_pass http://n8n-app:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
