[defaults]
# Path to inventory file
inventory = inventory.ini

# Disable host key checking for CI/CD (security note: only for controlled environments)
host_key_checking = False

# Use the machine's SSH config
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

# Timeout for operations (seconds)
timeout = 30

# Gather facts on demand — playbook sets gather_facts: true explicitly
gathering = smart

# Use Python 3 interpreter
interpreter_python = auto_silent

# Log all output for CI/CD debugging
log_path = /tmp/ansible-deploy.log

# Retry failed hosts
retry_files_enabled = False

# Show diffs when files change
diff_mode = True

# Output formatting
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = profile_tasks, timer

# Verbosity (0 = normal, 1 = verbose, 2 = more verbose, etc.)
verbosity = 0

[privilege_escalation]
# Use sudo for privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Use pipelining for better performance
pipelining = True

# SSH connection timeout
timeout = 10
