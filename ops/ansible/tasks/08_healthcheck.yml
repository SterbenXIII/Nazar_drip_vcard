---
- name: Wait for API container and Docker healthcheck
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}' vcard-api"
  register: api_health_status
  changed_when: false
  retries: 12
  delay: 10
  until: api_health_status.rc == 0 and (api_health_status.stdout | trim) == 'running|healthy'
  tags: [health, check]

- name: Check required container states
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}' {{ item }}"
  register: container_statuses
  changed_when: false
  failed_when: false
  loop:
    - vcard-api
    - vcard-clinic-web
    - vcard-proxy
  tags: [health, check]

- name: Assert required containers are running and healthy when configured
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | trim).split('|')[0] == 'running'
      - (item.stdout | trim).split('|')[1] in ['none', 'healthy']
    fail_msg: 'Required container {{ item.item }} is stopped or unhealthy.'
  loop: '{{ container_statuses.results }}'
  tags: [health, verify]

- name: Verify API health inside the Docker network
  ansible.builtin.shell: >-
    docker exec vcard-api curl --fail --silent --output /dev/null --max-time 5
    http://localhost:5678/api/health >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: internal_health_check
  changed_when: false
  retries: 3
  delay: 5
  until: internal_health_check.rc == 0
  no_log: true
  tags: [health, verify]

- name: Validate active Caddy configuration
  ansible.builtin.command:
    cmd: docker exec vcard-proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  changed_when: false
  no_log: true
  tags: [health, verify]

- name: Trust the internal CA only inside the disposable localhost lab
  when: lab_mode | bool
  become: true
  block:
    - name: Request the local HTTPS certificate
      ansible.builtin.shell: >-
        curl --insecure --silent --output /dev/null --max-time 10
        https://localhost/ || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install the Caddy lab CA for URI health checks
      ansible.builtin.command:
        cmd: docker cp vcard-proxy:/data/caddy/pki/authorities/local/root.crt /usr/local/share/ca-certificates/clinic-caddy-lab.crt
      changed_when: true

    - name: Refresh trusted lab CAs
      ansible.builtin.command: update-ca-certificates
      changed_when: true
  tags: [health, verify]

- name: Verify authenticated API health on both HTTPS domains
  ansible.builtin.uri:
    url: '{{ item }}/api/health'
    url_username: stage
    url_password: '{{ stage_basic_auth_password }}'
    force_basic_auth: true
    method: GET
    status_code: 200
    timeout: 15
  register: health_checks
  no_log: true
  retries: 3
  delay: 10
  until: health_checks.status == 200
  loop:
    - 'https://{{ domain_name }}'
    - 'https://www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify authenticated staging homepage and noindex policy on both HTTPS domains
  ansible.builtin.uri:
    url: '{{ item }}/'
    url_username: stage
    url_password: '{{ stage_basic_auth_password }}'
    force_basic_auth: true
    method: GET
    return_content: true
    status_code: 200
    timeout: 15
  register: staging_homepage_checks
  failed_when: >-
    staging_homepage_checks.status != 200 or
    'noindex' not in (staging_homepage_checks.content | lower) or
    'nofollow' not in (staging_homepage_checks.content | lower)
  no_log: true
  retries: 3
  delay: 15
  until: staging_homepage_checks.status == 200
  loop:
    - 'https://{{ domain_name }}'
    - 'https://www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify unauthenticated staging requests return 401 on both HTTPS domains
  ansible.builtin.uri:
    url: '{{ item }}/'
    method: GET
    status_code: 401
    timeout: 15
  register: unauthenticated_stage_checks
  no_log: true
  retries: 3
  delay: 10
  until: unauthenticated_stage_checks.status == 401
  loop:
    - 'https://{{ domain_name }}'
    - 'https://www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify incorrect staging credentials return 401 on both HTTPS domains
  ansible.builtin.uri:
    url: '{{ item }}/'
    url_username: stage
    url_password: deliberately-invalid-stage-password
    force_basic_auth: true
    method: GET
    status_code: 401
    timeout: 15
  register: invalid_credential_checks
  no_log: true
  retries: 3
  delay: 10
  until: invalid_credential_checks.status == 401
  loop:
    - 'https://{{ domain_name }}'
    - 'https://www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify HTTP redirects to HTTPS on both domains
  ansible.builtin.uri:
    url: 'http://{{ item }}/'
    method: GET
    status_code: 308
    timeout: 15
    follow_redirects: none
  register: http_redirect_checks
  no_log: true
  retries: 3
  delay: 10
  until: http_redirect_checks.status == 308
  loop:
    - '{{ domain_name }}'
    - 'www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify HTTP lead submissions are rejected on both domains
  ansible.builtin.uri:
    url: 'http://{{ item }}/api/leads/submit'
    method: POST
    body: '{}'
    body_format: json
    status_code: 403
    timeout: 15
  register: http_stage_submission_checks
  no_log: true
  retries: 3
  delay: 10
  until: http_stage_submission_checks.status == 403
  loop:
    - '{{ domain_name }}'
    - 'www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify authenticated HTTPS lead submissions remain disabled on both domains
  ansible.builtin.uri:
    url: '{{ item }}/api/leads/submit'
    method: POST
    body: '{}'
    body_format: json
    status_code: 403
    timeout: 15
    url_username: stage
    url_password: '{{ stage_basic_auth_password }}'
    force_basic_auth: true
  register: stage_submission_checks
  no_log: true
  retries: 3
  delay: 10
  until: stage_submission_checks.status == 403
  loop:
    - 'https://{{ domain_name }}'
    - 'https://www.{{ domain_name }}'
  when: node_env == 'production'
  tags: [health, verify]

- name: Display safe health check result
  ansible.builtin.debug:
    msg: 'Service state, API health, HTTPS authentication, robots policy, and disabled lead submission checks passed.'
  when: node_env == 'production'
  tags: [health]
