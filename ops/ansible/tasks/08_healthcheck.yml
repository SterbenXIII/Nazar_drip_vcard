---
- name: 🔍 Check required container states
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{.State.Status}}{% endraw %}' {{ item }}"
  register: container_statuses
  changed_when: false
  failed_when: false
  loop:
    - vcard-api
    - vcard-clinic-web
    - vcard-proxy
  tags: [health, check]

- name: ✅ Wait for API container to become running
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{.State.Status}}{% endraw %}' vcard-api"
  register: api_running_status
  changed_when: false
  retries: 6
  delay: 10
  until: api_running_status.rc == 0 and (api_running_status.stdout | trim) == 'running'
  tags: [health, check]

- name: Assert required containers are running
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | trim) == 'running'
    fail_msg: 'Required container {{ item.item }} is not running.'
  loop: '{{ container_statuses.results }}'
  tags: [health]

- name: 🔍 Check API Docker health status
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}' vcard-api"
  register: api_health_status
  changed_when: false
  failed_when: false
  retries: 6
  delay: 10
  until: api_health_status.rc == 0 and (api_health_status.stdout | trim) == 'healthy'
  tags: [health, check]

- name: Assert API Docker healthcheck passed
  ansible.builtin.assert:
    that:
      - api_health_status.rc == 0
      - (api_health_status.stdout | trim) == 'healthy'
    fail_msg: 'vcard-api Docker healthcheck is not healthy.'
  tags: [health, verify]

- name: Verify API health inside Docker network
  ansible.builtin.command:
    cmd: docker exec vcard-api curl --fail --silent --show-error http://localhost:5678/api/health
  register: internal_health_check
  changed_when: false
  retries: 3
  delay: 5
  until: internal_health_check.rc == 0
  tags: [health, verify]

- name: Validate active Caddy configuration
  ansible.builtin.command:
    cmd: docker exec vcard-proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  changed_when: false
  tags: [health, verify]

- name: ✅ Verify API health endpoint
  ansible.builtin.uri:
    url: 'https://{{ domain_name }}/api/health'
    url_username: stage
    url_password: '{{ stage_basic_auth_password }}'
    force_basic_auth: true
    method: GET
    status_code: 200
    timeout: 15
  register: health_check
  no_log: true
  retries: 3
  delay: 10
  until: health_check.status == 200
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify protected HTTPS staging homepage
  ansible.builtin.uri:
    url: 'https://{{ domain_name }}/'
    url_username: stage
    url_password: '{{ stage_basic_auth_password }}'
    force_basic_auth: true
    method: GET
    status_code: 200
    timeout: 15
  register: staging_homepage_check
  no_log: true
  retries: 3
  delay: 15
  until: staging_homepage_check.status == 200
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify staging authentication blocks unauthenticated requests
  ansible.builtin.uri:
    url: 'https://{{ domain_name }}/'
    method: GET
    status_code: 401
    timeout: 15
  register: unauthenticated_stage_check
  retries: 3
  delay: 10
  until: unauthenticated_stage_check.status == 401
  no_log: true
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify HTTP redirects to HTTPS
  ansible.builtin.uri:
    url: 'http://{{ domain_name }}/'
    method: GET
    status_code: 308
    timeout: 15
    follow_redirects: none
  register: http_redirect_check
  retries: 3
  delay: 10
  until: http_redirect_check.status == 308
  no_log: true
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify HTTP stage lead submissions are rejected before redirect
  ansible.builtin.uri:
    url: 'http://{{ domain_name }}/api/leads/submit'
    method: POST
    body: '{}'
    body_format: json
    status_code: 403
    timeout: 15
  register: http_stage_submission_check
  retries: 3
  delay: 10
  until: http_stage_submission_check.status == 403
  no_log: true
  when: node_env == 'production'
  tags: [health, verify]

- name: Verify public stage lead submissions stay disabled
  ansible.builtin.uri:
    url: 'https://{{ domain_name }}/api/leads/submit'
    method: POST
    body: '{}'
    body_format: json
    status_code: 403
    timeout: 15
    url_username: stage
    url_password: '{{ stage_basic_auth_password }}'
    force_basic_auth: true
  register: stage_submission_check
  retries: 3
  delay: 10
  until: stage_submission_check.status == 403
  no_log: true
  when: node_env == 'production'
  tags: [health, verify]

- name: 📊 Display health check result
  ansible.builtin.debug:
    msg: "Health check: {{ 'PASSED ✅' if (health_check.status | default(0)) == 200 else 'FAILED ⚠️' }}"
  when: health_check is defined and health_check is not skipped
  tags: [health]
