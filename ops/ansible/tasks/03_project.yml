---
- name: 📁 Ensure project directory exists
  ansible.builtin.file:
    path: '{{ project_dir }}'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'
  tags: [project]

- name: 📁 Check if repository is already cloned
  ansible.builtin.stat:
    path: '{{ project_dir }}/.git'
  register: git_repo
  tags: [git]

- name: 📥 Initialize repository (first time — handles non-empty directory)
  become: true
  become_user: '{{ ansible_user }}'
  ansible.builtin.shell: |
    cd "{{ project_dir }}"
    git init
    git remote add origin "{{ repository_url }}" 2>/dev/null || git remote set-url origin "{{ repository_url }}"
    git fetch origin main
    git checkout -B main origin/main
  args:
    creates: '{{ project_dir }}/.git/HEAD'
  when: not git_repo.stat.exists
  no_log: true
  tags: [git, clone]

- name: 📥 Update repository (pull latest changes)
  become: true
  become_user: '{{ ansible_user }}'
  ansible.builtin.git:
    repo: '{{ repository_url }}'
    dest: '{{ project_dir }}'
    version: main
    force: true
    update: true
  when: git_repo.stat.exists
  no_log: true
  tags: [git, update]

- name: 📁 Create required subdirectories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'
  loop:
    - '{{ data_dir }}'
    - '{{ backup_dir }}'
  tags: [project]

- name: 📋 Write protected Telegram allowlist
  ansible.builtin.copy:
    content: >-
      {{
        (
          (telegram_allowed_chat_ids | trim).split(',')
          | map('trim')
          | map('int')
          | list
          | to_json
        ) if (telegram_allowed_chat_ids | default('', true) | trim | length > 0) else '[]'
      }}
    dest: '{{ project_dir }}/apps/api/allowed_chats.json'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0600'
    force: true
  no_log: true
  tags: [project]
