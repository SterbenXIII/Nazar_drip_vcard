---
- name: Resolve staging DNS to the expected VPS before changing Caddy
  become: true
  become_user: '{{ ansible_user }}'
  ansible.builtin.command:
    argv: [getent, ahostsv4, '{{ staging_domain }}']
  register: staging_dns
  changed_when: false

- name: Require staging DNS to include this VPS
  ansible.builtin.assert:
    that:
      - (staging_dns.stdout_lines | map('split') | map('first') | unique | list) == [vps_ip]
    fail_msg: 'staging.havenhub.com.ua must resolve to the configured VPS before HTTPS activation.'

- name: Configure or preserve the staging HTTPS route
  block:
    - name: Check whether production routing is active
      ansible.builtin.stat:
        path: '{{ domain_cutover_marker }}'
      register: production_domain_active

    - name: Prepare staging-only Caddy configuration
      when: not production_domain_active.stat.exists
      block:
        - name: Check for an existing persistent Caddy configuration
          ansible.builtin.stat:
            path: '{{ active_caddyfile_path }}'
          register: active_caddyfile

        - name: Create persistent Caddy include directory
          ansible.builtin.file:
            path: '{{ active_caddy_includes_path }}'
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Create a per-release recovery directory for the previous Caddy configuration
          ansible.builtin.file:
            path: '{{ project_dir }}/releases/staging/caddy-before-{{ release_sha }}/includes'
            state: directory
            owner: '{{ ansible_user }}'
            group: '{{ ansible_user }}'
            mode: '0700'
          when: active_caddyfile.stat.exists

        - name: Preserve the previous active Caddyfile
          ansible.builtin.copy:
            src: '{{ active_caddyfile_path }}'
            dest: '{{ project_dir }}/releases/staging/caddy-before-{{ release_sha }}/Caddyfile'
            remote_src: true
            owner: '{{ ansible_user }}'
            group: '{{ ansible_user }}'
            mode: '0600'
            force: false
          when: active_caddyfile.stat.exists

        - name: Preserve the previous active Caddy includes
          ansible.builtin.copy:
            src: '{{ active_caddy_includes_path }}/'
            dest: '{{ project_dir }}/releases/staging/caddy-before-{{ release_sha }}/includes/'
            remote_src: true
            owner: '{{ ansible_user }}'
            group: '{{ ansible_user }}'
            mode: preserve
            force: false
          when: active_caddyfile.stat.exists

        - name: Install the staging Caddyfile
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../docker/caddy/Caddyfile.staging'
            dest: '{{ active_caddyfile_path }}'
            owner: root
            group: root
            mode: '0644'

        - name: Install shared and staging Caddy snippets
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../docker/caddy/{{ item }}'
            dest: '{{ active_caddy_includes_path }}/{{ item }}'
            owner: root
            group: root
            mode: '0644'
          loop:
            - common.caddy
            - legacy-sites.caddy
            - staging-sites.caddy

        - name: Validate Caddy configuration before activation
          become: true
          become_user: '{{ ansible_user }}'
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --env
              - DOMAIN_NAME=havenhub.tech
              - --env
              - STAGE_BASIC_AUTH_HASH={{ stage_basic_auth_hash }}
              - --mount
              - 'type=bind,src={{ active_caddyfile_path }},dst=/etc/caddy/Caddyfile,readonly'
              - --mount
              - 'type=bind,src={{ active_caddy_includes_path }},dst=/etc/caddy/includes,readonly'
              - '{{ caddy_image_ref }}'
              - caddy
              - validate
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          changed_when: false
          no_log: true

    - name: Start or refresh Caddy with the persistent configuration
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - compose
          - -f
          - ops/docker/compose/docker-compose.proxy.yml
          - -f
          - ops/docker/compose/docker-compose.staging-proxy.yml
          - up
          - -d
          - caddy
      args:
        chdir: '{{ project_dir }}'
      environment:
        CADDY_IMAGE_REF: '{{ caddy_image_ref }}'
        CADDYFILE_PATH: '{{ active_caddyfile_path }}'
        CADDY_INCLUDES_PATH: '{{ active_caddy_includes_path }}'
        CADDY_DOMAIN_NAME: havenhub.tech
        STAGE_BASIC_AUTH_HASH: '{{ stage_basic_auth_hash }}'
      changed_when: true
      no_log: true

    - name: Reload and validate active Caddy configuration
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.command:
        argv:
          [
            docker,
            exec,
            vcard-proxy,
            caddy,
            reload,
            --config,
            /etc/caddy/Caddyfile,
            --adapter,
            caddyfile,
          ]
      changed_when: true
      no_log: true

    - name: Validate running Caddy configuration
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.command:
        argv:
          [
            docker,
            exec,
            vcard-proxy,
            caddy,
            validate,
            --config,
            /etc/caddy/Caddyfile,
            --adapter,
            caddyfile,
          ]
      changed_when: false

    - name: Verify staging API health behind Basic Auth
      ansible.builtin.uri:
        url: 'https://{{ staging_domain }}/api/health'
        url_username: stage
        url_password: '{{ stage_basic_auth_password }}'
        force_basic_auth: true
        status_code: 200
        timeout: 15
      register: staging_api_health
      retries: 6
      delay: 10
      until: staging_api_health.status == 200
      no_log: true

    - name: Verify staging page, noindex, and canonical policy
      ansible.builtin.uri:
        url: 'https://{{ staging_domain }}/'
        url_username: stage
        url_password: '{{ stage_basic_auth_password }}'
        force_basic_auth: true
        return_content: true
        status_code: 200
        timeout: 15
      register: staging_homepage
      no_log: true

    - name: Validate staging homepage publication policy
      ansible.builtin.assert:
        that:
          - staging_homepage.status == 200
          - "'noindex' in (staging_homepage.content | lower)"
          - "'nofollow' in (staging_homepage.content | lower)"
          - "'rel=\"canonical\"' not in (staging_homepage.content | lower)"
          - "'noindex, nofollow' in (staging_homepage.headers['x-robots-tag'] | default('') | lower)"
        fail_msg: >-
          Staging homepage policy mismatch:
          status_ok={{ staging_homepage.status == 200 }},
          noindex_meta={{ 'noindex' in (staging_homepage.content | lower) }},
          nofollow_meta={{ 'nofollow' in (staging_homepage.content | lower) }},
          canonical_absent={{ 'rel="canonical"' not in (staging_homepage.content | lower) }},
          noindex_header={{ 'noindex, nofollow' in (staging_homepage.headers['x-robots-tag'] | default('') | lower) }}.

    - name: Verify staging robots file denies indexing
      ansible.builtin.uri:
        url: 'https://{{ staging_domain }}/robots.txt'
        url_username: stage
        url_password: '{{ stage_basic_auth_password }}'
        force_basic_auth: true
        return_content: true
        status_code: 200
        timeout: 15
      register: staging_robots
      failed_when: >-
        staging_robots.status != 200 or
        'Disallow: /' not in staging_robots.content
      no_log: true

    - name: Verify staging has no sitemap
      ansible.builtin.uri:
        url: 'https://{{ staging_domain }}/sitemap.xml'
        url_username: stage
        url_password: '{{ stage_basic_auth_password }}'
        force_basic_auth: true
        status_code: 404
        timeout: 15
      no_log: true

    - name: Verify unauthenticated staging requests are rejected
      ansible.builtin.uri:
        url: 'https://{{ staging_domain }}/'
        status_code: 401
        timeout: 15
      no_log: true

    - name: Verify staging HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: 'http://{{ staging_domain }}/'
        status_code: 308
        timeout: 15
        follow_redirects: none
      register: staging_redirect
      failed_when: staging_redirect.status != 308 or 'https://' not in staging_redirect.location
      no_log: true

    - name: Verify staging API has no production notification providers
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.command:
        cmd: >-
          docker exec vcard-api-staging node -e
          'if (process.env.ENABLED_PROVIDERS !== "EMAIL" || process.env.TELEGRAM_BOT_TOKEN) process.exit(1)'
      changed_when: false

    - name: Capture the newest staging mailbox message before the smoke lead
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.shell: |
        docker exec -i vcard-api-staging node <<'NODE'
        ;(async () => {
          const response = await fetch('http://mailpit:8025/api/v1/messages?limit=1')
          if (!response.ok) process.exit(1)
          const body = await response.json()
          console.log(body.messages?.[0]?.ID ?? '')
        })().catch(() => process.exit(1))
        NODE
      args:
        executable: /bin/bash
      register: staging_mailpit_before
      changed_when: false
      retries: 12
      delay: 5
      until: staging_mailpit_before.rc == 0
      no_log: true

    - name: Submit one synthetic lead through staging only
      ansible.builtin.uri:
        url: 'https://{{ staging_domain }}/api/leads/submit'
        url_username: stage
        url_password: '{{ stage_basic_auth_password }}'
        force_basic_auth: true
        method: POST
        body_format: json
        body:
          name: 'Staging Smoke Test'
          phone: '+380000000000'
          district: ''
          services: ['verification']
          source: staging-smoke
        status_code: 201
        timeout: 60
      no_log: true

    - name: Verify Mailpit captured the new staging notification
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.shell: |
        docker exec -i -e MAILPIT_BEFORE_ID="$MAILPIT_BEFORE_ID" vcard-api-staging node <<'NODE'
        const before = process.env.MAILPIT_BEFORE_ID
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
        const latest = async () => {
          const response = await fetch('http://mailpit:8025/api/v1/messages?limit=1')
          if (!response.ok) throw new Error('Mailpit API is unavailable')
          const body = await response.json()
          return body.messages?.[0]?.ID ?? ''
        }
        ;(async () => {
          for (let attempt = 0; attempt < 30; attempt += 1) {
            const id = await latest()
            if (id && id !== before) {
              console.log('Mailpit captured a new staging notification')
              return
            }
            await wait(2000)
          }
          process.exit(1)
        })().catch(() => process.exit(1))
        NODE
      args:
        executable: /bin/bash
      environment:
        MAILPIT_BEFORE_ID: '{{ staging_mailpit_before.stdout | trim }}'
      changed_when: false
      no_log: true

    - name: Verify staging data volume and Mailpit have no public port bindings
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.shell: |
        set -euo pipefail
        mount_info=$(docker inspect --format '{% raw %}{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}} {{.Name}}{{end}}{{end}}{% endraw %}' vcard-api-staging)
        test "$mount_info" = 'volume compose-staging_api_data'
        bindings=$(docker inspect --format '{% raw %}{{json .HostConfig.PortBindings}}{% endraw %}' vcard-mailpit-staging)
        test "$bindings" = 'null' || test "$bindings" = '{}'
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true

  rescue:
    - name: Check whether production routing is active
      ansible.builtin.stat:
        path: '{{ domain_cutover_marker }}'
      register: production_domain_active

    - name: Restore the prior Caddy configuration after a failed staging deploy
      when: not production_domain_active.stat.exists
      block:
        - name: Restore the prior Caddyfile when one existed
          ansible.builtin.copy:
            src: '{{ project_dir }}/releases/staging/caddy-before-{{ release_sha }}/Caddyfile'
            dest: '{{ active_caddyfile_path }}'
            remote_src: true
            owner: root
            group: root
            mode: '0644'
          when: active_caddyfile is defined and active_caddyfile.stat.exists

        - name: Restore the prior Caddy includes when they existed
          ansible.builtin.copy:
            src: '{{ project_dir }}/releases/staging/caddy-before-{{ release_sha }}/includes/'
            dest: '{{ active_caddy_includes_path }}/'
            remote_src: true
            owner: root
            group: root
            mode: preserve
          when: active_caddyfile is defined and active_caddyfile.stat.exists

        - name: Restore the pre-migration Caddyfile on first activation
          ansible.builtin.copy:
            src: '{{ project_dir }}/releases/pre-domain-migration/Caddyfile'
            dest: '{{ active_caddyfile_path }}'
            remote_src: true
            owner: root
            group: root
            mode: '0644'
          when: active_caddyfile is defined and not active_caddyfile.stat.exists

        - name: Refresh the proxy with the restored configuration
          become: true
          become_user: '{{ ansible_user }}'
          ansible.builtin.command:
            argv:
              [
                docker,
                compose,
                --project-name,
                compose,
                -f,
                ops/docker/compose/docker-compose.proxy.yml,
                -f,
                ops/docker/compose/docker-compose.staging-proxy.yml,
                up,
                -d,
                caddy,
              ]
          args:
            chdir: '{{ project_dir }}'
          environment:
            CADDY_IMAGE_REF: '{{ caddy_image_ref }}'
            CADDYFILE_PATH: '{{ active_caddyfile_path }}'
            CADDY_INCLUDES_PATH: '{{ active_caddy_includes_path }}'
            CADDY_DOMAIN_NAME: havenhub.tech
            STAGE_BASIC_AUTH_HASH: '{{ stage_basic_auth_hash }}'
          failed_when: false
          no_log: true

        - name: Reload the restored proxy configuration
          become: true
          become_user: '{{ ansible_user }}'
          ansible.builtin.command:
            argv:
              [
                docker,
                exec,
                vcard-proxy,
                caddy,
                reload,
                --config,
                /etc/caddy/Caddyfile,
                --adapter,
                caddyfile,
              ]
          failed_when: false
          no_log: true

    - name: Stop after staging failure and safe Caddy recovery
      ansible.builtin.fail:
        msg: 'Staging deployment failed. Production data and release pointer were not modified.'
