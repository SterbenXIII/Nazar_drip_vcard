# ============================================================================
# Ansible Inventory for Hostinger VPS Deployment
# ============================================================================
#
# All dynamic values (host, user, deploy path) are injected at runtime
# via --extra-vars from GitHub Actions. This file contains only static
# defaults for local testing.
#
# Usage:
#   # CI/CD (target_host is REQUIRED):
#   ansible-playbook -i inventory.ini playbook.yml \
#     --extra-vars "target_host=76.13.79.71 ansible_user=root"
#
#   # Local testing with explicit host:
#   ansible-playbook -i inventory.ini playbook.yml \
#     -e "target_host=76.13.79.71 ansible_user=root"
#
# ============================================================================

[vps]
hostinger-vps

[vps:vars]
# Connection — target_host MUST be passed via --extra-vars (no unsafe localhost default)
ansible_host={{ target_host | default('localhost') }}
ansible_user=root
ansible_port=22
ansible_python_interpreter=/usr/bin/python3

# Note: All deployment variables (domain_name, deploy_path, timezone, etc.)
# are defined in playbook.yml vars block with env lookups.
# Override via --extra-vars or environment variables in CI/CD.
# See playbook.yml PHASE 4 and vars section for the full list.

[all:vars]
# Use default SSH host key checking for security
