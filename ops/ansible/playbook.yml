---
# ============================================================================
# Ansible Playbook: Idempotent Deployment for Hostinger VPS
# ============================================================================
# Project: astro-vcard monorepo
# Target: Ubuntu VPS with Docker
# CI/CD: GitHub Actions
# ============================================================================

- name: Deploy astro-vcard to Hostinger VPS
  hosts: vps
  gather_facts: true
  become: false

  vars:
    vps_ip: "{{ lookup('env', 'VPS_IP') | default('localhost', true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('havenhub.tech', true) }}"
    node_env: "{{ lookup('env', 'NODE_ENV') | default('production', true) }}"
    deploy_path: "{{ lookup('env', 'DEPLOY_PATH') | default('/home/emerald-recovery', true) }}"
    docker_network: "{{ lookup('env', 'DOCKER_NETWORK') | default('web-gateway', true) }}"
    compose_project_name: 'compose'
    caddy_image_ref: "{{ lookup('env', 'CADDY_IMAGE_REF') | default('docker.io/library/caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f', true) }}"
    timezone: "{{ lookup('env', 'TIMEZONE') | default('Europe/Kyiv', true) }}"
    image_registry: ''
    image_tag: ''
    release_sha: "{{ lookup('env', 'RELEASE_SHA') | default(image_tag, true) }}"
    api_image_ref: ''
    clinic_web_image_ref: ''
    rollback_mode: false
    lab_mode: false

    # github_token is used only for GHCR pulls; the repository itself is public.
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    github_repository_path: 'SterbenXIII/Nazar_drip_vcard.git'
    github_repository_url: ''
    github_repository_source: "{{ github_repository_path if (github_repository_path | default('', true) | length > 0) else github_repository_url }}"
    github_repository_path_normalized: >-
      {{
        github_repository_source
        | regex_replace('^(https?://github\\.com/)+', '')
        | regex_replace('^git@github\\.com:', '')        | regex_replace('\.git$', '')        | regex_replace('/+$', '')
      }}
    repository_url: 'https://github.com/{{ github_repository_path_normalized }}.git'

    # Override these via --extra-vars in GitHub Actions
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    telegram_master_id: "{{ lookup('env', 'TELEGRAM_MASTER_ID') }}"
    telegram_allowed_chat_ids: "{{ lookup('env', 'TELEGRAM_ALLOWED_CHAT_IDS') }}"
    enabled_providers: "{{ lookup('env', 'ENABLED_PROVIDERS') | default('TELEGRAM', true) }}"
    backend_port: "{{ lookup('env', 'BACKEND_PORT') | default('5678', true) }}"
    webhook_secret: "{{ lookup('env', 'WEBHOOK_SECRET') | default('', true) }}"
    telegram_notify_ids: "{{ lookup('env', 'TELEGRAM_NOTIFY_IDS') }}"
    stage_basic_auth_password: "{{ lookup('env', 'STAGE_BASIC_AUTH_PASSWORD') }}"
    stage_basic_auth_hash: "{{ lookup('env', 'STAGE_BASIC_AUTH_HASH') }}"

    # Paths and project config (from inventory)
    project_dir: '{{ deploy_path }}'
    backup_dir: '{{ deploy_path }}/backups'
    current_release_manifest: '{{ project_dir }}/releases/current.json'
    reconciliation_marker: '{{ project_dir }}/releases/reconciliation-required.json'

  tasks:
    - name: Validate required deployment variables
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host != '127.0.0.1'
          - ansible_host != 'localhost'
        fail_msg: >
          FATAL: ansible_host is not set or points to localhost.
          Pass --extra-vars "target_host=<VPS_IP>" to set the target host.
        success_msg: 'Target host: {{ ansible_host }}'
      tags: [always]

    - name: Validate protected staging credentials
      ansible.builtin.assert:
        that:
          - stage_basic_auth_password | default('', true) | length >= 16
          - stage_basic_auth_hash | default('', true) | length > 0
        fail_msg: 'FATAL: protected staging credentials are not configured.'
        success_msg: 'Protected staging credentials are configured.'
      when: node_env == 'production'
      no_log: true
      tags: [always, deploy]

    - name: Restrict disposable lab deployments to localhost and local image tags
      ansible.builtin.assert:
        that:
          - domain_name == 'localhost'
          - project_dir is match('^/opt/clinic-cd-lab(/|$)')
          - release_sha is match('^[0-9a-f]{40}$')
          - api_image_ref == ('local/vcard-api:' ~ release_sha)
          - clinic_web_image_ref == ('local/vcard-clinic-web:' ~ release_sha)
        fail_msg: 'Lab mode is restricted to localhost, the disposable lab path, and SHA-tagged local images.'
      when: lab_mode | bool
      tags: [always]

    - name: Check for unresolved release reconciliation state
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ reconciliation_marker }}'
        - '{{ reconciliation_marker }}.pending'
      register: reconciliation_state
      tags: [always, deploy, rollback]

    - name: Block deployment until the previous release is reconciled
      ansible.builtin.assert:
        that:
          - reconciliation_state.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          A release reconciliation marker exists. Compare the running containers, checkout,
          backup and SQLite schema with the operator report before another deploy or rollback.
      tags: [always, deploy, rollback]

    - name: Validate immutable production release
      ansible.builtin.assert:
        that:
          - release_sha is match('^[0-9a-f]{40}$')
          - >-
            api_image_ref is match('^ghcr\.io/[a-z0-9._/-]+/vcard-api@sha256:[0-9a-f]{64}$') or
            ((lab_mode | bool) and api_image_ref == ('local/vcard-api:' ~ release_sha))
          - >-
            clinic_web_image_ref is match('^ghcr\.io/[a-z0-9._/-]+/vcard-clinic-web@sha256:[0-9a-f]{64}$') or
            ((lab_mode | bool) and clinic_web_image_ref == ('local/vcard-clinic-web:' ~ release_sha))
        fail_msg: 'FATAL: production requires a full release SHA and immutable GHCR image digests.'
        success_msg: 'Immutable production release and image references are configured.'
      when: node_env == 'production'
      tags: [always, deploy]

    - name: Check requested rollback release manifest
      ansible.builtin.stat:
        path: '{{ project_dir }}/releases/{{ release_sha }}.json'
      register: rollback_manifest_stat
      when: rollback_mode | bool
      tags: [always, rollback]

    - name: Require a previously successful release manifest for rollback
      ansible.builtin.assert:
        that:
          - rollback_manifest_stat.stat.exists
        fail_msg: 'Rollback target has no successful release manifest on the VPS.'
      when: rollback_mode | bool
      tags: [always, rollback]

    - name: Read requested rollback release manifest
      ansible.builtin.slurp:
        src: '{{ project_dir }}/releases/{{ release_sha }}.json'
      register: rollback_manifest_content
      when: rollback_mode | bool
      tags: [always, rollback]

    - name: Parse requested rollback release manifest
      ansible.builtin.set_fact:
        rollback_manifest: '{{ rollback_manifest_content.content | b64decode | from_json }}'
      when: rollback_mode | bool
      tags: [always, rollback]

    - name: Validate requested rollback manifest and image digests
      ansible.builtin.assert:
        that:
          - rollback_manifest.keys() | sort == ['api_image_ref', 'ci_run_id', 'clinic_web_image_ref', 'deploy_run_id', 'release_sha']
          - rollback_manifest.release_sha == release_sha
          - rollback_manifest.api_image_ref == api_image_ref
          - rollback_manifest.clinic_web_image_ref == clinic_web_image_ref
          - rollback_manifest.ci_run_id | string is match('^[0-9]+$')
          - rollback_manifest.deploy_run_id | string is match('^[0-9]+$')
        fail_msg: 'Rollback target manifest does not match the requested SHA and image digests.'
      when: rollback_mode | bool
      no_log: true
      tags: [always, rollback]

    - name: Validate Telegram allowlist input
      ansible.builtin.assert:
        that:
          - telegram_allowed_chat_ids | default('', true) | trim | length == 0 or (telegram_allowed_chat_ids | regex_replace('\\s+', '')) is match('^-?[0-9]+(,-?[0-9]+)*$')
          - node_env != 'production' or telegram_allowed_chat_ids | default('', true) | trim | length > 0
        fail_msg: >-
          FATAL: TELEGRAM_ALLOWED_CHAT_IDS must be a comma-separated list of
          numeric Telegram IDs and is required for production deployment.
        success_msg: 'Telegram allowlist input is valid.'
      no_log: true
      tags: [always, env]

    - name: Main Deployment Block
      block:
        - name: 01 - Preflight & System Check
          ansible.builtin.include_tasks: tasks/01_preflight_system.yml

        - name: Snapshot existing SQLite data before checkout or recreation
          ansible.builtin.include_tasks: tasks/backup_sqlite.yml

        - name: 02 - Network & Firewall
          ansible.builtin.include_tasks: tasks/02_network.yml

        - name: 03 - Project Workspace Setup
          ansible.builtin.include_tasks: tasks/03_project.yml

        - name: 04 - Environment Variables & Cron
          ansible.builtin.include_tasks: tasks/04_environment.yml

        - name: 05 - Deployment (GHCR Pull & Compose)
          ansible.builtin.include_tasks: tasks/05_deployment.yml

        - name: 06 - File Permissions
          ansible.builtin.include_tasks: tasks/06_permissions.yml

        - name: 07 - Docker Pruning
          ansible.builtin.include_tasks: tasks/07_cleanup.yml

        - name: 08 - Healthchecks
          ansible.builtin.include_tasks: tasks/08_healthcheck.yml

      rescue:
        - name: '🔍 Capture deployment diagnostics'
          ansible.builtin.shell: |
            cd "{{ project_dir }}"
            {
              echo '=== compose ps ==='
              docker compose --project-name "{{ compose_project_name }}" \
                -f ops/docker/compose/docker-compose.yml \
                -f ops/docker/compose/docker-compose.proxy.yml ps -a 2>&1 || true
              echo '=== release ==='
              printf 'candidate_sha=%s\n' '{{ release_sha }}'
              for container in vcard-api vcard-clinic-web vcard-proxy; do
                if docker container inspect "${container}" >/dev/null 2>&1; then
                  docker container inspect --format '{% raw %}{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}} restarts={{.RestartCount}}{% endraw %}' "${container}" 2>&1 || true
                else
                  printf '%s status=missing\n' "$container"
                fi
              done
              if docker container inspect vcard-api >/dev/null 2>&1; then
                if docker exec vcard-api curl --fail --silent --output /dev/null --max-time 5 http://localhost:5678/api/health >/dev/null 2>&1; then
                  echo 'api_http_health=passed'
                else
                  echo 'api_http_health=failed'
                fi
              else
                echo 'api_http_health=unavailable'
              fi
              echo 'Public smoke checks: inspect workflow step status; response bodies and credentials are not recorded.'
            }
          args:
            executable: /bin/bash
          environment:
            CADDY_IMAGE_REF: '{{ caddy_image_ref }}'
          register: deployment_diagnostics
          changed_when: false

        - name: Notify Telegram
          community.general.telegram:
            token: '{{ telegram_bot_token }}'
            api_method: sendMessage
            api_args:
              chat_id: '{{ telegram_master_id }}'
              parse_mode: 'HTML'
              text: |
                Deployment failed for release {{ release_sha }}.
                Check the GitHub Actions run for service states and the SQLite snapshot path.
          failed_when: false
          no_log: true

        - name: Fail deployment after diagnostics
          ansible.builtin.fail:
            msg: 'Deployment failed; diagnostics were captured and the failure notification was attempted.'

    - name: 📋 Deployment Summary
      ansible.builtin.debug:
        msg:
          - '========================================'
          - 'Deployment Complete'
          - '========================================'
          - 'VPS IP: {{ vps_ip }}'
          - 'Project: {{ project_dir }}'
          - 'API Port: {{ backend_port }}'
          - 'Docker Network: {{ docker_network }}'
          - 'Environment: {{ node_env }}'
          - '========================================'
          - 'Next steps:'
          - '1. Stage: https://{{ domain_name }}/ (HTTP Basic Auth required)'
          - '2. API health: https://{{ domain_name }}/api/health (HTTP Basic Auth required)'
          - '3. Check current service health: {{ project_dir }}/scripts/monitor.sh'
          - '========================================'
      tags: [always]

  handlers:
    - name: Restart_services
      become: true
      become_user: '{{ ansible_user }}'
      ansible.builtin.shell: |
        cd "{{ project_dir }}"
        docker compose --project-name "{{ compose_project_name }}" \
          -f ops/docker/compose/docker-compose.yml restart api clinic-web
      environment:
        VPS_IP: '{{ vps_ip }}'
        NODE_ENV: '{{ node_env }}'
        BACKEND_PORT: '{{ backend_port }}'
        CADDY_IMAGE_REF: '{{ caddy_image_ref }}'
      changed_when: true
