services:
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    depends_on:
      - core
      - edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default

  core:
    ports: !override []

  edge:
    ports: !override []
