name: 🚀 Deploy to Hostinger VPS (SSH)

on:
  workflow_dispatch:

env:
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'localhost' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/emerald-recovery' }}
  VPS_IP: ${{ vars.VPS_IP || 'localhost' }}

jobs:
  deploy:
    name: SSH Deploy & Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Validate domain variable
        run: |
          if [ "${{ env.DOMAIN_NAME }}" = "localhost" ]; then
            echo "❌ DOMAIN_NAME is localhost. Set repository variable DOMAIN_NAME before production deploy."
            exit 1
          fi

      - name: 🔐 Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ env.VPS_IP }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "⚠️ ssh-keyscan failed (continuing)"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "echo '✓ SSH connected'"

      - name: 📦 Pull latest code & deploy
        env:
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ env.VPS_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" <<'EOF'
          set -e

          echo "📍 Deploying to ${{ env.DEPLOY_PATH }}"
          cd "${{ env.DEPLOY_PATH }}"

          echo "🔄 Pulling latest changes from git..."
          git pull origin main

          echo "📋 Preparing environment..."
          if [ ! -f .env ]; then
            echo "❌ Error: .env not found on VPS. Setup required!"
            exit 1
          fi

          echo "⚙️  Initializing environment (networks, directories)..."
          make init

          echo "🏗 Building Docker images..."
          make rebuild

          echo "✅ Compose deployment command completed; public smoke tests are pending."
          EOF

      - name: 🔍 Verify deployment
        run: |
          DOMAIN="${{ env.DOMAIN_NAME }}"
          MAX_ATTEMPTS=5
          RETRY_DELAY=15

          check_https() {
            local label="$1"
            local url="$2"
            local status

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              status=$(curl --silent --show-error --location --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url") || status=000
              if [ "$status" = "200" ]; then
                echo "✅ $label: HTTP $status"
                return 0
              fi
              echo "⚠️ $label attempt $attempt/$MAX_ATTEMPTS: HTTP $status"
              [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$RETRY_DELAY"
            done

            echo "❌ $label failed after $MAX_ATTEMPTS attempts: $url"
            return 1
          }

          check_csp() {
            local headers status csp

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              headers=$(curl --silent --show-error --location --dump-header - --output /dev/null \
                --max-time 20 "https://$DOMAIN/") || headers=''
              status=$(printf '%s\n' "$headers" | awk '/^HTTP/{status=$2} END{print status}')
              csp=$(printf '%s\n' "$headers" | awk 'tolower($1) == "content-security-policy:" {sub(/^[^:]*:[[:space:]]*/, ""); value=$0} END{print value}')
              if [ "$status" = "200" ] \
                && printf '%s' "$csp" | grep -q 'https://www.googletagmanager.com' \
                && printf '%s' "$csp" | grep -q 'connect-src'; then
                echo "✅ CSP: required production directives found"
                return 0
              fi
              echo "⚠️ CSP attempt $attempt/$MAX_ATTEMPTS: HTTP ${status:-000}, required directives missing"
              [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$RETRY_DELAY"
            done

            echo "❌ CSP failed after $MAX_ATTEMPTS attempts: https://$DOMAIN/"
            return 1
          }

          echo "⏳ Checking public HTTPS deployment endpoints..."
          check_https 'Frontend' "https://$DOMAIN/"
          check_https 'API health' "https://$DOMAIN/api/health"
          check_csp
          echo "✨ Public frontend, API, and CSP checks passed."

      - name: 📢 Notify Telegram (success)
        if: success()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_MASTER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deployment to ${{ env.DOMAIN_NAME }} successful!
            Branch: main
            Commit: ${{ github.sha }}

      - name: 📢 Notify Telegram (failure)
        if: failure()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_MASTER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deployment to ${{ env.DOMAIN_NAME }} failed!
            Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
