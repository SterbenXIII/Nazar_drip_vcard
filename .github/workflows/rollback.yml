name: ⏪ Rollback to Specific Version

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to rollback to'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/emerald-recovery' }}
  VPS_IP: ${{ vars.VPS_IP || 'localhost' }}
  DOMAIN_NAME: havenhub.tech
  SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}

jobs:
  rollback:
    name: Rollback to ${{ inputs.commit_sha }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.DOMAIN_NAME }}
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: 🔎 Validate rollback commit SHA
        env:
          ROLLBACK_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '❌ commit_sha must be a full lowercase 40-character commit SHA.'
            exit 1
          fi

      - name: 🔧 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: 📦 Install Ansible and dependencies
        run: |
          pip install ansible
          ansible-galaxy collection install -r ops/ansible/requirements.yml

      - name: 🛡️ Validate rollback VPS IP
        env:
          VPS_IP: ${{ env.VPS_IP }}
        run: |
          if [ -z "$VPS_IP" ] || [ "$VPS_IP" = "localhost" ]; then
            echo '❌ Set the repository variable VPS_IP to the public VPS IPv4 address.'
            exit 1
          fi

          if ! python3 -c 'import ipaddress, os; ipaddress.IPv4Address(os.environ["VPS_IP"])'; then
            echo '❌ VPS_IP must be a valid IPv4 address.'
            exit 1
          fi

      - name: 🔐 Prepare staging authentication
        env:
          STAGE_BASIC_AUTH_PASSWORD: ${{ secrets.STAGE_BASIC_AUTH_PASSWORD }}
        run: |
          if [ "${#STAGE_BASIC_AUTH_PASSWORD}" -lt 16 ]; then
            echo '❌ STAGE_BASIC_AUTH_PASSWORD must contain at least 16 characters.'
            exit 1
          fi

          STAGE_BASIC_AUTH_HASH=$(docker run --rm --entrypoint sh \
            -e STAGE_BASIC_AUTH_PASSWORD caddy:2-alpine \
            -c 'caddy hash-password --plaintext "$STAGE_BASIC_AUTH_PASSWORD"')
          if [ -z "$STAGE_BASIC_AUTH_HASH" ]; then
            echo '❌ Failed to prepare the staging authentication hash.'
            exit 1
          fi
          echo "::add-mask::$STAGE_BASIC_AUTH_HASH"
          printf 'STAGE_BASIC_AUTH_HASH=%s\n' "$STAGE_BASIC_AUTH_HASH" >> "$GITHUB_ENV"

      - name: 🔠 Lowercase Repository Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: 🔐 Configure SSH key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ env.VPS_IP }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: 🚀 Run Rollback with Ansible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          VPS_IP: ${{ env.VPS_IP }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DOMAIN_NAME: ${{ env.DOMAIN_NAME }}
          STAGE_BASIC_AUTH_HASH: ${{ env.STAGE_BASIC_AUTH_HASH }}
          STAGE_BASIC_AUTH_PASSWORD: ${{ secrets.STAGE_BASIC_AUTH_PASSWORD }}
          NODE_ENV: 'production'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MASTER_ID: ${{ secrets.TELEGRAM_MASTER_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_NOTIFY_IDS: ${{ secrets.TELEGRAM_NOTIFY_IDS }}
          ENABLED_PROVIDERS: 'TELEGRAM'
          BACKEND_PORT: '5678'
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          cd ops/ansible
          ansible-playbook playbook.yml \
            -vv \
            -i inventory.ini \
            --private-key $HOME/.ssh/deploy_key \
            --extra-vars "target_host=${{ env.VPS_IP }}" \
            --extra-vars "ansible_user=${HOSTINGER_SSH_USER}" \
            --extra-vars "ansible_ssh_private_key_file=$HOME/.ssh/deploy_key" \
            --extra-vars "deploy_path=${DEPLOY_PATH}" \
            --extra-vars "vps_ip=${VPS_IP}" \
            --extra-vars "github_repository_path=${{ github.repository }}.git" \
            --extra-vars "image_registry=ghcr.io/${{ env.REPO_LC }}/" \
            --extra-vars "rollback_mode=true" \
            --extra-vars "image_tag=${{ inputs.commit_sha }}"

      - name: 🔍 Verify rollback (smoke tests)
        env:
          STAGE_BASIC_AUTH_PASSWORD: ${{ secrets.STAGE_BASIC_AUTH_PASSWORD }}
        run: |
          MAX_ATTEMPTS=5
          RETRY_DELAY=15

          check_https() {
            local label="$1"
            local url="$2"
            local status

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              status=$(curl --silent --show-error --location --user "stage:${STAGE_BASIC_AUTH_PASSWORD}" \
                --output /dev/null --write-out '%{http_code}' --max-time 20 "$url") || status=000
              if [ "$status" = "200" ]; then
                echo "✅ $label: HTTP $status"
                return 0
              fi
              echo "⚠️ $label attempt $attempt/$MAX_ATTEMPTS: HTTP $status"
              [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$RETRY_DELAY"
            done

            echo "❌ $label failed after $MAX_ATTEMPTS attempts: $url"
            return 1
          }

          BASE_URL="https://${{ env.DOMAIN_NAME }}"
          echo "⏳ Checking authenticated HTTPS rollback endpoints..."
          check_https 'Clinic frontend (apex)' "$BASE_URL/"
          check_https 'Clinic frontend (www)' "https://www.${{ env.DOMAIN_NAME }}/"
          check_https 'API health' "$BASE_URL/api/health"

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$BASE_URL/") || status=000
          if [ "$status" != "401" ]; then
            echo "❌ Staging homepage must require authentication; got HTTP $status."
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "http://${{ env.DOMAIN_NAME }}/") || status=000
          if [ "$status" != "308" ]; then
            echo "❌ HTTP homepage must redirect to HTTPS; got HTTP $status."
            exit 1
          fi

          status=$(curl --silent --show-error --request POST --data '{}' \
            --output /dev/null --write-out '%{http_code}' --max-time 20 \
            "http://${{ env.DOMAIN_NAME }}/api/leads/submit") || status=000
          if [ "$status" != "403" ]; then
            echo "❌ HTTP lead submissions must be blocked before redirect; got HTTP $status."
            exit 1
          fi

          status=$(curl --silent --show-error --user "stage:${STAGE_BASIC_AUTH_PASSWORD}" \
            --request POST --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$BASE_URL/api/leads/submit") || status=000
          if [ "$status" != "403" ]; then
            echo "❌ Staging lead submission must remain disabled; got HTTP $status."
            exit 1
          fi
          echo "✅ Rollback TLS/auth and disabled lead-submission checks passed."

      - name: 💬 Notify Telegram (success)
        if: success()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_MASTER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ⏪ Rollback Success

            Version: ${{ inputs.commit_sha }}
            Access: https://${{ env.DOMAIN_NAME }}
            verified ✓

      - name: 🚨 Notify Telegram (failure)
        if: failure()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_MASTER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Rollback Failed

            Attempted SHA: ${{ inputs.commit_sha }}
            Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
