name: Clinic web CI

on:
  pull_request:
    branches: [ref/migrate]
    paths:
      - 'apps/clinic-web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'Makefile'
      - 'docs/Havenhub*.md'
      - 'docs/HAVENHUB — *.docx'
      - 'docs/havenhub-kit/**'
      - 'docs/superpowers/specs/2026-10-07-havenhub-landing-seo-design.md'
      - 'docs/superpowers/plans/2026-10-08-havenhub-landing-seo.md'
      - '.github/workflows/clinic-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clinic web and A6 docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @vcard/shared build

      - name: Check clinic web
        run: make clinic-check

      - name: Build normal clinic site
        run: make clinic-build

      - name: Install Chromium
        run: pnpm --filter @vcard/clinic-web exec playwright install --with-deps chromium

      - name: Run clinic acceptance checks
        run: make clinic-acceptance

      - name: Verify isolated E2E test inventories
        run: node --test apps/clinic-web/scripts/e2e-inventory.test.mjs

      - name: Run clinic browser tests
        run: pnpm --filter @vcard/clinic-web test:e2e

      - name: Run isolated publication mode matrix
        run: pnpm --filter @vcard/clinic-web test:publication

      - name: Build clinic Docker image
        run: make clinic-docker-build

      - name: Start clinic Docker container
        run: make clinic-docker-up

      - name: Smoke test clinic Docker container
        run: make clinic-docker-check

      - name: Stop clinic Docker container
        if: always()
        run: make clinic-docker-down

      - name: Lint authoritative Havenhub Markdown
        run: |
          pnpm exec markdownlint-cli2 \
            "docs/Havenhub Codex Stage Prompts.md" \
            "docs/Havenhub Frontend Implementation Plan.md"
          git ls-files -z -- docs/havenhub-kit \
            docs/superpowers/specs/2026-10-07-havenhub-landing-seo-design.md \
            docs/superpowers/plans/2026-10-08-havenhub-landing-seo.md \
            | xargs -0 pnpm exec markdownlint-cli2

      - name: Check HAVENHUB README local links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path('docs/havenhub-kit/README.md')
          links = [link.split('#', 1)[0] for link in re.findall(r'\]\(([^)]+)\)', readme.read_text())
                   if not re.match(r'^[a-z][a-z0-9+.-]*:', link, re.I)]
          missing = [link for link in links if link and not (readme.parent / link).is_file()]
          if missing:
              raise SystemExit(f'Missing README targets: {missing}')
          print(f'Checked {len(links)} local README links')
          PY

      - name: Scan current tree for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --no-banner --no-color
