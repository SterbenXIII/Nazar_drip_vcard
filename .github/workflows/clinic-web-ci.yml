name: Clinic web checks

on:
  workflow_call:
    inputs:
      suite:
        description: Clinic suite selected by the authoritative CI workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Clinic ${{ inputs.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate requested clinic suite
        env:
          CLINIC_SUITE: ${{ inputs.suite }}
        run: |
          case "$CLINIC_SUITE" in
            acceptance|publication) ;;
            *) echo 'Unsupported clinic suite.'; exit 2 ;;
          esac
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @vcard/shared build
      - name: Install Chromium and system dependencies
        if: ${{ inputs.suite == 'acceptance' || inputs.suite == 'publication' }}
        run: pnpm --filter @vcard/clinic-web exec playwright install --with-deps chromium
      - name: Verify isolated E2E test inventories
        if: ${{ inputs.suite == 'acceptance' }}
        run: node --test apps/clinic-web/scripts/e2e-inventory.test.mjs
      - name: Run clinic acceptance suite
        if: ${{ inputs.suite == 'acceptance' }}
        run: pnpm --filter @vcard/clinic-web acceptance
      - name: Run isolated publication matrix
        if: ${{ inputs.suite == 'publication' }}
        run: pnpm --filter @vcard/clinic-web test:publication
      - name: Upload acceptance diagnostics
        if: ${{ failure() && inputs.suite == 'acceptance' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clinic-acceptance-diagnostics
          path: /tmp/clinic-acceptance-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload publication diagnostics
        if: ${{ failure() && inputs.suite == 'publication' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clinic-publication-diagnostics
          path: apps/clinic-web/test-results/
          if-no-files-found: warn
          retention-days: 14
