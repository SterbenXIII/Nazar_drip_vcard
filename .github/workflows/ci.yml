name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Current-tree secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan tracked and untracked workspace files
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --no-banner --no-color

  active-checks:
    name: Active checks and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @vcard/shared build
      - name: Test dependency audit classifier
        run: node --test scripts/ci/audit-release.test.mjs
      - name: Audit active release dependencies
        env:
          AUDIT_REPORT_PATH: audit-report.json
        run: node scripts/ci/audit-release.mjs
      - name: Lint API and shared package
        run: |
          pnpm --filter @vcard/api lint
          pnpm --filter @vcard/shared lint
      - name: Typecheck API and shared package
        run: |
          pnpm --filter @vcard/api exec tsc --noEmit
          pnpm --filter @vcard/shared typecheck
      - name: Check formatting for active manifests and CI files
        run: >-
          pnpm exec prettier --check
          package.json
          pnpm-workspace.yaml
          pnpm-lock.yaml
          apps/api/package.json
          apps/clinic-web/package.json
          packages/shared/package.json
          scripts/ci/audit-release.mjs
          scripts/ci/audit-release.test.mjs
          scripts/ci/audit-exceptions.json
          .github/workflows/ci.yml
          .github/workflows/clinic-web-ci.yml
          .github/workflows/legacy-web-ci.yml
      - name: Lint authoritative clinic documentation
        run: |
          pnpm exec markdownlint-cli2 \
            "docs/Havenhub Codex Stage Prompts.md" \
            "docs/Havenhub Frontend Implementation Plan.md"
          git ls-files -z -- docs/havenhub-kit \
            docs/superpowers/specs/2026-10-07-havenhub-landing-seo-design.md \
            docs/superpowers/plans/2026-10-08-havenhub-landing-seo.md \
            | xargs -0 pnpm exec markdownlint-cli2
      - name: Check HAVENHUB README local links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path('docs/havenhub-kit/README.md')
          links = [
              link.split('#', 1)[0]
              for link in re.findall(r'\]\(([^)]+)\)', readme.read_text())
              if not re.match(r'^[a-z][a-z0-9+.-]*:', link, re.I)
          ]
          missing = [link for link in links if link and not (readme.parent / link).is_file()]
          if missing:
              raise SystemExit(f'Missing README targets: {missing}')
          print(f'Checked {len(links)} local README links')
          PY
      - name: Upload redacted active dependency audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: active-dependency-audit
          path: audit-report.json
          if-no-files-found: warn
          retention-days: 14

  api-tests:
    name: API tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @vcard/shared build
      - name: Run isolated API tests with mocked notification providers
        run: pnpm --filter @vcard/api test

  clinic-acceptance:
    name: Clinic acceptance
    uses: ./.github/workflows/clinic-web-ci.yml
    permissions:
      contents: read
    with:
      suite: acceptance

  clinic-publication:
    name: Clinic publication matrix
    uses: ./.github/workflows/clinic-web-ci.yml
    permissions:
      contents: read
    with:
      suite: publication

  runtime-images:
    name: Runtime image build and smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: ops/docker/api/Dockerfile
      - name: Lint clinic Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: apps/clinic-web/Dockerfile
      - name: Build API runtime image
        run: docker build --pull --no-cache --target runtime --tag vcard-api:ci -f ops/docker/api/Dockerfile .
      - name: Build clinic runtime image
        run: docker build --pull --no-cache --target runtime --tag vcard-clinic-web:ci -f apps/clinic-web/Dockerfile .
      - name: Smoke test API native SQLite dependency
        run: >-
          docker run --rm --workdir /app/apps/api --entrypoint node vcard-api:ci
          --input-type=commonjs -e
          "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.close()"
      - name: Smoke test clinic runtime image
        run: |
          set -euo pipefail
          container=clinic-ci-smoke
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" --add-host=api:127.0.0.1 \
            -p 127.0.0.1:8080:8080 vcard-clinic-web:ci
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/ >/tmp/clinic-index.html; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo 'Clinic container did not become healthy.'
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/clinic-index.html
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/)
          test "$status" = 200
          grep -Eiq 'noindex, *nofollow' /tmp/clinic-index.html
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/not-a-real-route)
          test "$status" = 404

  ops-contract:
    name: Deployment contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test deployment preflight helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Verify authoritative CI and CD boundary
        run: bash tests/test_clinic_ci_contract.sh
      - name: Verify deployment contract
        run: bash tests/test_clinic_vps_deployment_contract.sh
      - name: Verify phase 2 deployment contract
        run: bash tests/test_phase2_deployment_contract.sh
      - name: Verify stale release gate
        run: bash scripts/ci/test_release_head.sh
      - name: Verify clinic monitoring and public smoke contracts
        run: bash tests/test_clinic_monitoring.sh && bash tests/test_clinic_stage_smoke.sh

  release-ready:
    name: Release ready
    runs-on: ubuntu-24.04
    needs:
      - secret-scan
      - active-checks
      - api-tests
      - clinic-acceptance
      - clinic-publication
      - runtime-images
      - ops-contract
    if: >-
      always() &&
      needs.secret-scan.result == 'success' &&
      needs.active-checks.result == 'success' &&
      needs.api-tests.result == 'success' &&
      needs.clinic-acceptance.result == 'success' &&
      needs.clinic-publication.result == 'success' &&
      needs.runtime-images.result == 'success' &&
      needs.ops-contract.result == 'success'
    steps:
      - name: Confirm all required jobs passed
        run: echo 'All release checks passed.'
