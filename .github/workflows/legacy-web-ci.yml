name: Legacy web CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'ops/docker/web/Dockerfile'
      - '.github/workflows/legacy-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'ops/docker/web/Dockerfile'
      - '.github/workflows/legacy-web-ci.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      e2e_scope:
        description: E2E coverage to run
        required: true
        default: smoke
        type: choice
        options: [smoke, full]

permissions:
  contents: read

concurrency:
  group: legacy-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-web:
    name: Legacy web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @vcard/shared build
      - name: Lint legacy web
        run: pnpm --filter @vcard/web lint
      - name: Typecheck and build legacy web
        run: |
          pnpm --filter @vcard/web exec astro check
          pnpm --filter @vcard/web build
      - name: Install Chromium and system dependencies
        run: pnpm --filter @vcard/web exec playwright install --with-deps chromium
      - name: Run Chromium, accessibility, and SEO smoke
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.e2e_scope == 'smoke') }}
        run: >-
          pnpm --filter @vcard/web exec playwright test
          --project=chromium --project=a11y --project=seo
      - name: Run full legacy E2E suite
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e_scope == 'full') }}
        run: pnpm --filter @vcard/web test:e2e
      - name: Run legacy Lighthouse CI
        run: pnpx @lhci/cli autorun
        working-directory: apps/web
      - name: Upload legacy browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-web-browser-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  legacy-web-docker-lint:
    name: Legacy web Dockerfile lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint legacy web Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: ops/docker/web/Dockerfile
