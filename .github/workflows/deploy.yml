name: 🚀 Deploy to Hostinger VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'localhost' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/emerald-recovery' }}
  VPS_IP: ${{ vars.VPS_IP || 'localhost' }}
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
  SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}

jobs:
  build-and-push:
    name: Build & Push to GHCR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: 🔠 Lowercase Repository Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: 🐳 Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: 📦 Build and push API
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ops/docker/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/vcard-api:latest
            ghcr.io/${{ env.REPO_LC }}/vcard-api:${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and push Web
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ops/docker/web/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/vcard-web:latest
            ghcr.io/${{ env.REPO_LC }}/vcard-web:${{ env.COMMIT_SHA }}
          build-args: |
            DOMAIN_NAME=${{ env.DOMAIN_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: 🛡️ Run Trivy vulnerability scanner (API)
      #   uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
      #   with:
      #     image-ref: ghcr.io/${{ env.REPO_LC }}/vcard-api:${{ github.sha }}
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'
      #   env:
      #     TRIVY_USERNAME: ${{ github.actor }}
      #     TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # - name: 🛡️ Run Trivy vulnerability scanner (Web)
      #   uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
      #   with:
      #     image-ref: ghcr.io/${{ env.REPO_LC }}/vcard-web:${{ github.sha }}
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'
      #   env:
      #     TRIVY_USERNAME: ${{ github.actor }}
      #     TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-vps:
    name: Deploy with Ansible
    needs: build-and-push
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.DOMAIN_NAME }}
    steps:
      - name: 🚚 Checkout code (for Ansible playbook)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}

      - name: 🔧 Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: 📦 Install Ansible and dependencies
        run: |
          pip install ansible==11.3.0
          ansible-galaxy collection install -r ops/ansible/requirements.yml
          ansible --version

      - name: 🛡️ Validate deploy host/domain vars
        run: |
          if [ "${{ env.DOMAIN_NAME }}" = "localhost" ]; then
            echo "❌ DOMAIN_NAME is localhost. Set repository variable DOMAIN_NAME for production deploys."
            exit 1
          fi

          if [ "${{ env.VPS_IP }}" = "localhost" ]; then
            echo "❌ VPS_IP is localhost. Set repository variable VPS_IP for production deploys."
            exit 1
          fi

      - name: 🔠 Lowercase Repository Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: 🔐 Configure SSH key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ env.VPS_IP }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null
          echo "✓ SSH key configured"
          echo "🔑 Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key || echo "⚠️ Cannot read key fingerprint"

      - name: 🛠️ Test SSH connectivity
        env:
          SSH_HOST: ${{ env.VPS_IP }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=15
          SUCCESS=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Testing SSH to ${SSH_USER}@${SSH_HOST} (Attempt $i/$MAX_RETRIES)..."
            if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "echo SSH_OK"; then
              echo "✅ SSH connection successful"
              SUCCESS=1
              break
            else
              echo "⚠️ SSH connection failed on attempt $i."
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Sleeping $RETRY_DELAY seconds before retrying..."
                sleep $RETRY_DELAY
              fi
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "❌ SSH connection failed after $MAX_RETRIES attempts. Debugging:"
            echo "  User: ${SSH_USER}"
            echo "  Host: ${SSH_HOST}"
            echo "  Key file exists: $(test -f ~/.ssh/deploy_key && echo yes || echo no)"
            echo "  Key permissions: $(ls -la ~/.ssh/deploy_key)"
            echo ""
            echo "Running verbose SSH for diagnostics..."
            ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "echo SSH_OK" 2>&1 | tail -30
            exit 1
          fi

      - name: 🔍 VPS Pre-flight Check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.HOSTINGER_SSH_USER }}@${{ env.VPS_IP }} "
            set -e
            echo '--- Disk Space ---'
            df -h /
            echo '--- Memory ---'
            free -m
            echo '--- Docker Status ---'
            systemctl is-active docker

            DISK_AVAILABLE_KB=\$(df -Pk / | awk 'NR==2 {print \$4}')
            MEM_AVAILABLE_MB=\$(free -m | awk '/^Mem:/ {print \$7}')

            echo \"Computed free disk: \${DISK_AVAILABLE_KB} KB\"
            echo \"Computed available memory: \${MEM_AVAILABLE_MB} MB\"

            if [ \"\${DISK_AVAILABLE_KB}\" -lt 1048576 ]; then
              echo '❌ Pre-flight failed: free disk is below 1 GB.'
              exit 1
            fi

            if [ \"\${MEM_AVAILABLE_MB}\" -lt 200 ]; then
              echo '❌ Pre-flight failed: available memory is below 200 MB.'
              exit 1
            fi

            echo '✅ Pre-flight resource checks passed.'
          "

      - name: 🚀 Deploy with Ansible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DOMAIN_NAME: ${{ env.DOMAIN_NAME }}
          NODE_ENV: 'production'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MASTER_ID: ${{ secrets.TELEGRAM_MASTER_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_NOTIFY_IDS: ${{ secrets.TELEGRAM_NOTIFY_IDS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ENABLED_PROVIDERS: ${{ secrets.ENABLED_PROVIDERS || 'TELEGRAM,EMAIL' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BACKEND_PORT: '5678'
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          N8N_PORT: ${{ vars.N8N_PORT || '5679' }}
          N8N_HOST: ${{ vars.N8N_HOST || env.DOMAIN_NAME }}
          N8N_PROTOCOL: ${{ vars.N8N_PROTOCOL || 'https' }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_COMMUNITY_PACKAGES_ENABLED: ${{ vars.N8N_COMMUNITY_PACKAGES_ENABLED || 'true' }}
          GENERIC_TIMEZONE: ${{ vars.GENERIC_TIMEZONE || 'Europe/Kyiv' }}
          POSTGRES_NON_ROOT_USER: ${{ vars.POSTGRES_NON_ROOT_USER || 'n8n' }}
          POSTGRES_NON_ROOT_PASSWORD: ${{ secrets.POSTGRES_NON_ROOT_PASSWORD || secrets.POSTGRES_PASSWORD }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION || '' }}
        run: |
          cd ops/ansible
          ansible-playbook playbook.yml \
            -vv \
            -i inventory.ini \
            --private-key $HOME/.ssh/deploy_key \
            --extra-vars "target_host=${{ env.VPS_IP }}" \
            --extra-vars "ansible_user=${HOSTINGER_SSH_USER}" \
            --extra-vars "ansible_ssh_private_key_file=$HOME/.ssh/deploy_key" \
            --extra-vars "deploy_path=${DEPLOY_PATH}" \
            --extra-vars "domain_name=${DOMAIN_NAME}" \
            --extra-vars "github_repository_path=${{ github.repository }}.git" \
            --extra-vars "image_registry=ghcr.io/${{ env.REPO_LC }}/" \
            --extra-vars "image_tag=${{ env.COMMIT_SHA }}"

      - name: 🔍 Verify deployment (smoke tests)
        run: |
          DOMAIN="${{ env.DOMAIN_NAME }}"
          MAX_ATTEMPTS=5
          RETRY_DELAY=15

          check_https() {
            local label="$1"
            local url="$2"
            local status

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              status=$(curl --silent --show-error --location --output /dev/null \
                --write-out '%{http_code}' --max-time 20 "$url") || status=000
              if [ "$status" = "200" ]; then
                echo "✅ $label: HTTP $status"
                return 0
              fi
              echo "⚠️ $label attempt $attempt/$MAX_ATTEMPTS: HTTP $status"
              [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$RETRY_DELAY"
            done

            echo "❌ $label failed after $MAX_ATTEMPTS attempts: $url"
            return 1
          }

          check_csp() {
            local headers status csp

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              headers=$(curl --silent --show-error --location --dump-header - --output /dev/null \
                --max-time 20 "https://$DOMAIN/") || headers=''
              status=$(printf '%s\n' "$headers" | awk '/^HTTP/{status=$2} END{print status}')
              csp=$(printf '%s\n' "$headers" | awk 'tolower($1) == "content-security-policy:" {sub(/^[^:]*:[[:space:]]*/, ""); value=$0} END{print value}')
              if [ "$status" = "200" ] \
                && printf '%s' "$csp" | grep -q 'https://www.googletagmanager.com' \
                && printf '%s' "$csp" | grep -q 'connect-src'; then
                echo "✅ CSP: required production directives found"
                return 0
              fi
              echo "⚠️ CSP attempt $attempt/$MAX_ATTEMPTS: HTTP ${status:-000}, required directives missing"
              [ "$attempt" -lt "$MAX_ATTEMPTS" ] && sleep "$RETRY_DELAY"
            done

            echo "❌ CSP failed after $MAX_ATTEMPTS attempts: https://$DOMAIN/"
            return 1
          }

          echo "⏳ Checking public HTTPS deployment endpoints..."
          check_https 'Frontend' "https://$DOMAIN/"
          check_https 'API health' "https://$DOMAIN/api/health"
          check_csp
          echo "✨ Public frontend, API, and CSP checks passed."

      - name: 💬 Notify Telegram (success)
        if: success()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_MASTER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deployment Success

            Access: http://${{ env.VPS_IP }}
            Domain: ${{ env.DOMAIN_NAME }}
            Commit: ${{ env.COMMIT_SHA }}
            Branch: main

            Frontend & API verified ✓

      - name: 🚨 Notify Telegram (failure)
        if: failure()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_MASTER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deployment Failed

            Domain: ${{ env.DOMAIN_NAME }}
            Commit: ${{ env.COMMIT_SHA }}

            Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
